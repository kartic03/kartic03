name: build profile panels

on:
  schedule:
    # 03:20 UTC daily. GitHub throttles cron on shared runners, so this often
    # fires 20-40 minutes late; nothing here is time-critical.
    - cron: "20 3 * * *"
  # Scheduled workflows are disabled after 60 days without repository activity.
  # This job commits only when a panel actually changes, so a quiet spell can
  # switch it off. Run it by hand from the Actions tab to wake it up again.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-panels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install step: every generator is standard library only.
      # GITHUB_TOKEN lifts the API limit from 60 requests an hour to 1000,
      # which matters because the header makes one call per repository.
      - name: Generate panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py --user kartic03 --skip-preview

      - name: Commit if anything changed
        run: |
          git config user.name  "Kartic"
          git config user.email "karticmishra03@gmail.com"
          if git diff --quiet -- dist; then
            echo "panels unchanged; nothing to commit"
            exit 0
          fi
          git add dist
          git commit -m "dist updated"
          git push
